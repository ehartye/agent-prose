<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Reading</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<div id="desk" class="desk">
<nav id="rail" class="rail" aria-label="Review queue" hidden></nav>
<div class="work">
<header class="site-head">
<h1 id="title" tabindex="-1">Reading</h1>
<p id="subtitle" class="sub"></p>
</header>
<nav id="views" class="views" aria-label="What to look at" hidden></nav>
<div id="banner" class="banner" role="status" hidden></div>
<div id="notice" class="notice" role="alert" hidden></div>
<p id="speech-note" class="speech-note" hidden>Reading aloud isn't available in this browser.</p>
<main id="app">
<p class="quiet">Loading...</p>
</main>
</div>
</div>
<div id="live" class="sr-only" role="status" aria-live="polite"></div>
<noscript><p class="quiet">This page needs JavaScript to show your drafts.</p></noscript>
</body>
</html>
